services:
  neo4j-prod:
    image: neo4j:latest
    container_name: waymates-neo4j-prod
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_bolt_listen__address: 0.0.0.0:${NEO4J_PORT}
      NEO4J_server_http_listen__address: 0.0.0.0:${NEO4J_HTTP_PORT:-7474}
      NEO4J_dbms_connector_bolt_advertised__address: localhost:${NEO4J_PORT}
      NEO4J_dbms_connector_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
    volumes:
      - neo4j_prod_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "cypher-shell"
        - "-u"
        - "neo4j"
        - "-p"
        - "${NEO4J_PASSWORD}"
        - "-a"
        - "localhost:${NEO4J_PORT}"
        - "RETURN 1"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  neo4j-test:
    image: neo4j:latest
    container_name: waymates-neo4j-test
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      NEO4J_server_bolt_listen__address: 0.0.0.0:${NEO4J_PORT}
      NEO4J_server_http_listen__address: 0.0.0.0:${NEO4J_HTTP_PORT:-7476}
      NEO4J_dbms_connector_bolt_advertised__address: localhost:${NEO4J_PORT}
      NEO4J_dbms_connector_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7476}
    volumes:
      - neo4j_test_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "${NEO4J_PASSWORD}",
          "-a",
          "localhost:${NEO4J_PORT}",
          "RETURN 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

  structurizr:
    image: structurizr/lite:latest
    container_name: waymates-structurizr
    network_mode: host
    volumes:
      - ./docs/architecture:/usr/local/structurizr
    restart: unless-stopped
    # Доступен на http://localhost:8080 через host network

  structurizr-cli:
    image: structurizr/cli:latest
    container_name: waymates-structurizr-cli
    volumes:
      - ./docs/architecture:/workspace
    working_dir: /workspace
    profiles: ["tools"]
    environment: []  # No env vars needed for CLI
    command: validate -w /workspace/workspace.dsl

  redis:
    image: redis:7-alpine
    container_name: waymates-redis
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: waymates-redis-test
    ports:
      - "6380:6379"
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres-prod:
    image: postgres:16-alpine
    container_name: waymates-postgres-prod
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waymates_facade
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/facade-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres-test:
    image: postgres:16-alpine
    container_name: waymates-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: waymates_facade_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./database/facade-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

  core-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: core-test
    container_name: waymates-core-test
    network_mode: host
    environment:
      NEO4J_URI: bolt://localhost:${NEO4J_PORT}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORE_PORT: 9000
      CORE_HOST: 0.0.0.0
    depends_on:
      neo4j-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9000', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: "no"

  # Optional: Core REST API (if running in Docker instead of local tsx)
  # core:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: waymates-core
  #   network_mode: host
  #   env_file: .env.prod
  #   command: tsx src/core/index.ts
  #   depends_on:
  #     neo4j-prod:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   profiles: ["app"]

  # Optional: Facade MCP Server (if running in Docker instead of local tsx)
  # facade:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: waymates-facade
  #   network_mode: host
  #   env_file: .env.prod
  #   command: tsx src/facade/index.ts
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   profiles: ["app"]

volumes:
  neo4j_prod_data:
    driver: local
  neo4j_test_data:
    driver: local
  postgres_prod_data:
    driver: local
  postgres_test_data:
    driver: local
