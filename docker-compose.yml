# Docker Compose конфигурация для работы с VPN (--network host)
services:
  # Production Neo4j с host network
  neo4j-prod:
    image: neo4j:latest
    container_name: waymates-neo4j-prod
    network_mode: host # Использует сеть хоста напрямую
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      # Явно указываем порты для host network
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    volumes:
      - neo4j_prod_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    restart: unless-stopped

  # Integration Tests Neo4j
  neo4j-integration:
    image: neo4j:latest
    container_name: waymates-neo4j-integration
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      # Кастомные порты для integration
      NEO4J_server_bolt_listen__address: 0.0.0.0:7689
      NEO4J_server_http_listen__address: 0.0.0.0:7476
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7689
      NEO4J_dbms_connector_http_advertised__address: localhost:7476
    volumes:
      - neo4j_integration_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    restart: "no"

  # Functional Tests Neo4j
  neo4j-functional:
    image: neo4j:latest
    container_name: waymates-neo4j-functional
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      # Кастомные порты для functional
      NEO4J_server_bolt_listen__address: 0.0.0.0:7688
      NEO4J_server_http_listen__address: 0.0.0.0:7475
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7688
      NEO4J_dbms_connector_http_advertised__address: localhost:7475
    volumes:
      - neo4j_functional_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    restart: "no"

volumes:
  neo4j_prod_data:
    driver: local
  neo4j_integration_data:
    driver: local
  neo4j_functional_data:
    driver: local
