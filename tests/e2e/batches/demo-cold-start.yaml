name: demo-cold-start
description: Demo Video 2 - Cold start with CV from LinkedIn (English)
locale: en

steps:
  # Step 1: Send parsed CV (from Profile.pdf via parse_cv_to_text)
  - message: |
      Here's my CV:

      ## Technical Project Manager (2025 - 2025)
      Industry: Fintech, Company Size: Large, Location: Rostov-on-Don, Russia
      - 1+ year active contribution to open-source projects: diffyscan, state-mate and gate-seals (external + official)
      - Led roadmap and delivery for on-chain infrastructure
      - Developed blockchain integrations (Ethereum)
      - Created monitoring and DevOps process tools
      - Wrote technical documentation and runbooks
      - Programmed in TypeScript, Python, Vyper, Go

      ## Backend Team Lead (2023 - 2025)
      Industry: Security Systems, Company Size: Mid-size, Location: Rostov-on-Don, Russia
      - Led team of 7 developers
      - Increased team velocity by 30%
      - Achieved 2x growth of technical teams
      - Conducted 50+ technical interviews in 3 months, hired 10 developers
      - Led architecture, code review, technical interviews
      - Conducted 1:1 meetings and developed employees
      - Managed 3 products simultaneously with team: licensing system, monitoring center, OPS integrations
      - Developed API SDK for external service integrations
      - Led Agile/Scrum processes: sprints, quality retrospectives, sprint reviews
      - Established testing processes and QA team collaboration

      ## Software Engineer (C++/Embedded) (2016 - 2023)
      Industry: Research & Development, Company Size: Small, Location: Rostov-on-Don, Russia
      - Designed and developed comprehensive power management systems for UAV applications
      - STM32 microcontroller programming
      - Qt5 GUI development
      - Android app development for drones
      - Embedded systems and real-time systems work

      ## Education
      - Bachelor's degree in Information Systems and Environments (2018)

      ## Skills and Technologies
      - Programming Languages: TypeScript, NestJS, Python, Go, C++, Java, Vyper
      - DevOps & Infrastructure: Docker, Terraform, Prometheus, Kubernetes
      - Web3 Tools: Ethers.js, Viem, Wagmi, Hardhat
      - Microcontrollers: STM32
      - GUI Development: Qt5
      - Mobile Development: Android

      I'm a Russian citizen.
    expect:
      phase: awaiting_plan_confirmation

  # Step 2: Confirm plan
  - message: Yes, looks good
    expect:
      phase: awaiting_context_confirmation

  # Step 3: Context 1 (Software Engineer) - add missing skills
  - message: "add skills: qt5, android"
    expect:
      phase: awaiting_context_confirmation

  # Step 4: Confirm context 1
  - message: Confirmed
    expect:
      phase: awaiting_context_confirmation

  # Step 5: Context 2 (Backend Team Lead) - add tech skills (LLM extracts only methodologies)
  - message: "add skills: c++, qt, docker, groovy"
    expect:
      phase: awaiting_context_confirmation

  # Step 6: Confirm context 2
  - message: Confirmed
    expect:
      phase: awaiting_context_confirmation

  # Step 7: Context 3 (Technical PM) - fix domain and add skills
  - message: "change domain devops to backend, add skills: docker, terraform, prometheus, ethers.js"
    expect:
      phase: awaiting_context_confirmation

  # Step 8: Confirm context 3
  - message: Confirmed
    expect:
      phase: awaiting_final_confirmation

  # Step 9: Final confirmation - save all
  - message: Yes, save everything
    expect:
      phase: saved

  # === Part 2: Set goal and search pathfinders ===

  # Step 10: Set goal (same as adhoc)
  - message: I want to become head of engineering in Netherlands, AI/ML startup, around 200k salary
    expect:
      phase: showing_goal

  # Step 11: Confirm goal
  - message: Yes, that's my goal
    expect:
      phase: asking_search_mode

  # Step 12: Search pathfinders
  - message: Show me people who made this transition
    expect:
      phase: showing_pathfinder_results
      chartUrl: "!null"

  # Step 13: Ask advisor - who matches best
  - message: Which of these candidates matches my trajectory best and why?
    expect:
      phase: advising

  # Step 14: Ask advisor - recommendations from all
  - message: What key recommendations can you give me based on all found pathfinders?
    expect:
      phase: advising
