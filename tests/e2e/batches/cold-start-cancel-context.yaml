name: cold-start-cancel-context
description: Cancel during awaiting_context_confirmation phase
locale: ru

steps:
  - message: |
      Моя история: был бэкендером в Москве Python 2020-2022, IT компания.
      Это всё.
    expect:
      phase: awaiting_plan_confirmation

  - message: да
    expect:
      phase: awaiting_clarification

  - message: гражданство России
    expect:
      phase: awaiting_context_confirmation

  - message: нет, передумал, отмена
    expect:
      phase: cancelled
