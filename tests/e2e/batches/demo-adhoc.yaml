name: demo-adhoc
description: Demo Video 1 - Adhoc search flow (English)
locale: en

steps:
  # Step 1: Casual adhoc intent + full context
  - message: Hey, I'm just browsing, not ready to commit yet. I'm a senior backend developer, TypeScript and Python, 9 years experience, based in Russia
    expect:
      phase: confirming_adhoc_context
      adhocContext.position: senior

  # Step 2: Confirm and explore
  - message: Show me similar people
    expect:
      phase: showing_exploration_candidates
      chartUrl: "!null"

  # Step 3: Set goal
  - message: I want to become head of engineering in Netherlands, AI/ML startup, around 200k salary
    expect:
      phase: showing_goal

  # Step 4: Confirm goal
  - message: Yes, that's correct
    expect:
      phase: asking_search_mode

  # Step 5: Search pathfinders
  - message: Show me people who made this transition
    expect:
      phase: showing_pathfinder_results
      chartUrl: "!null"

  # Step 6: Ask advisor
  - message: What skills did they all need for this transition?
    expect:
      phase: advising
