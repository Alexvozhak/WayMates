name: cold-start-multi-context
description: Cold-start with 2 positions — full flow Context #1 → #2 → Final → saved
locale: ru

steps:
  - message: |
      Привет! Хочу рассказать карьерную историю.
      Сначала работал в Москве джуниором на Python, с 2019 по 2021.
      Потом перешёл в Питер на Go, с 2021 по 2023.
      Гражданство России.
      Это всё.
    expect:
      phase: awaiting_plan_confirmation

  - message: да, всё верно
    expect:
      phase: awaiting_context_confirmation

  - message: да, подтверждаю
    expect:
      phase: awaiting_context_confirmation

  - message: да
    expect:
      phase: awaiting_final_confirmation

  - message: да, сохраняй
    expect:
      phase: saved
