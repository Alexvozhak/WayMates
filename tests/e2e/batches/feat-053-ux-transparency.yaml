name: feat-053-ux-transparency
description: |
  FEAT-053: appliedFilters visibility + salary/feedback extraction
  Коммит: 40fe75a
locale: ru

steps:
  # === Test 1: appliedFilters in search-graph ===
  - message: senior backend, typescript, US
    expect:
      phase: confirming_adhoc_context
      check:
        - adhocContext.position == "senior"
        - adhocContext.countryCode == "US"

  - message: покажи похожих
    expect:
      phase: showing_exploration_candidates
      check:
        - appliedFilters != null
        # NLP должен показать "без фильтров" или filters info

  - message: добавь фильтр только за последние 6 месяцев
    expect:
      phase: showing_exploration_candidates
      check:
        - appliedFilters.recencyThresholdMonths == 6
        # NLP должен показать "transitions in last 6 months"

  # === Test 2: appliedFilters при 0 результатах ===
  - message: убери фильтр, покажи всех
    expect:
      phase: showing_exploration_candidates

  - message: хочу стать CTO
    expect:
      phase: showing_goal

  - message: сохрани
    expect:
      phase: asking_search_mode

  - message: проводники
    expect:
      phase: showing_pathfinder_results
      # Даже при 0 результатах — должны показать фильтры
