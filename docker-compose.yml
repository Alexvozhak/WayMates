services:
  neo4j-prod:
    image: neo4j:latest
    container_name: waymates-neo4j-prod
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_bolt_listen__address: 0.0.0.0:${NEO4J_PORT}
      NEO4J_server_http_listen__address: 0.0.0.0:${NEO4J_HTTP_PORT:-7474}
      NEO4J_dbms_connector_bolt_advertised__address: localhost:${NEO4J_PORT}
      NEO4J_dbms_connector_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
    volumes:
      - neo4j_prod_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    restart: unless-stopped

  neo4j-test:
    image: neo4j:latest
    container_name: waymates-neo4j-test
    network_mode: host
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      NEO4J_server_bolt_listen__address: 0.0.0.0:${NEO4J_PORT}
      NEO4J_server_http_listen__address: 0.0.0.0:${NEO4J_HTTP_PORT:-7476}
      NEO4J_dbms_connector_bolt_advertised__address: localhost:${NEO4J_PORT}
      NEO4J_dbms_connector_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7476}
    volumes:
      - neo4j_test_data:/data
      - ./database/init.cypher:/tmp/init.cypher:ro
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "${NEO4J_PASSWORD}",
          "-a",
          "localhost:${NEO4J_PORT}",
          "RETURN 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

volumes:
  neo4j_prod_data:
    driver: local
  neo4j_test_data:
    driver: local
