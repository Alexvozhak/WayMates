name: cold-start-max-rounds
description: Max clarification rounds (5) exceeded → failed
locale: ru

steps:
  - message: |
      Моя история: был бэкендером в Москве Python 2020-2022, IT компания.
      Готово.
    expect:
      phase: awaiting_plan_confirmation

  - message: да
    expect:
      phase: awaiting_clarification

  - message: не хочу говорить
    expect:
      phase: awaiting_clarification

  - message: пропусти это поле
    expect:
      phase: awaiting_clarification

  - message: какая разница
    expect:
      phase: awaiting_clarification

  - message: зачем вам это
    expect:
      phase: awaiting_clarification

  - message: всё равно не скажу
    expect:
      phase: failed
