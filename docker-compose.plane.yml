# Plane Project Management - Minimal Docker Compose (host network for VPN compatibility)
# Documentation: https://developers.plane.so/self-hosting/methods/docker-compose
#
# Simplified version:
# - Only essential services (postgres, redis, minio, api, worker, web)
# - Uses host network (VPN-friendly, no port mapping issues)
# - Removed: plane-space, plane-admin, plane-live, plane-proxy (not needed for local dev)
#
# Quick start:
#   1. cp .env.plane.example .env.plane
#   2. Edit .env.plane: set SECRET_KEY and passwords
#   3. docker-compose -f docker-compose.plane.yml --env-file .env.plane up -d
#   4. Open http://localhost:3080
#   5. Create admin account
#   6. Get API key: Settings → API Tokens

services:
  plane-postgres:
    image: postgres:15-alpine
    container_name: plane-postgres
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${PLANE_DB_PASSWORD:-plane}
      POSTGRES_DB: plane
      # Use custom port to avoid conflicts with WayMates Neo4j setup
      PGPORT: 5433
    volumes:
      - plane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 5

  plane-redis:
    image: redis:7-alpine
    container_name: plane-redis
    network_mode: host
    restart: unless-stopped
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    network_mode: host
    restart: unless-stopped
    command: server /data --address ":9001" --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plane}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-plane123456}
    volumes:
      - plane_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  plane-api:
    image: makeplane/plane-backend:latest
    container_name: plane-api
    network_mode: host
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      # Database (host network, custom port)
      DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD:-plane}@localhost:5433/plane
      REDIS_URL: redis://localhost:6380/

      # Application
      WEB_URL: ${PLANE_WEB_URL:-http://localhost:3080}
      CORS_ALLOWED_ORIGINS: ${PLANE_WEB_URL:-http://localhost:3080}

      # Secret Key (CHANGE THIS!)
      SECRET_KEY: ${PLANE_SECRET_KEY:-changeme-generate-random-secret}

      # Storage (MinIO on custom port)
      USE_MINIO: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plane}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-plane123456}
      AWS_S3_ENDPOINT_URL: http://localhost:9001
      AWS_S3_BUCKET_NAME: ${MINIO_BUCKET_NAME:-plane}
      FILE_SIZE_LIMIT: 5242880

      # Email (optional)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@plane.local}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}

      # Feature flags
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-1}
      ENABLE_EMAIL_PASSWORD: ${ENABLE_EMAIL_PASSWORD:-1}
      ENABLE_MAGIC_LINK_LOGIN: ${ENABLE_MAGIC_LINK_LOGIN:-0}
    depends_on:
      plane-postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy

  plane-worker:
    image: makeplane/plane-backend:latest
    container_name: plane-worker
    network_mode: host
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD:-plane}@localhost:5433/plane
      REDIS_URL: redis://localhost:6380/
      SECRET_KEY: ${PLANE_SECRET_KEY:-changeme-generate-random-secret}
      WEB_URL: ${PLANE_WEB_URL:-http://localhost:3080}

      # Storage
      USE_MINIO: "1"
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plane}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-plane123456}
      AWS_S3_ENDPOINT_URL: http://localhost:9001
      AWS_S3_BUCKET_NAME: ${MINIO_BUCKET_NAME:-plane}
    depends_on:
      plane-postgres:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy

  plane-web:
    image: makeplane/plane-frontend:latest
    container_name: plane-web
    network_mode: host
    restart: unless-stopped
    command: node web/server.js web
    environment:
      # Frontend talks to API on localhost:8000 (plane-api default)
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PORT: 3080
    depends_on:
      - plane-api
      - plane-worker

volumes:
  plane_postgres_data:
    driver: local
  plane_minio_data:
    driver: local
