# Vikunja Task Management with PostgreSQL
#
# Quick start:
#   cp .env.vikunja.example .env.vikunja
#   docker compose -f docker-compose.vikunja.yml --env-file .env.vikunja up -d
#
# Access: http://localhost:3456

services:
  vikunja-db:
    image: postgres:18-alpine
    container_name: vikunja-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${VIKUNJA_DB_NAME:-vikunja}
      POSTGRES_USER: ${VIKUNJA_DB_USER:-vikunja}
      POSTGRES_PASSWORD: ${VIKUNJA_DB_PASSWORD:?VIKUNJA_DB_PASSWORD required}
      PGPORT: ${VIKUNJA_DB_PORT:-5435}
    volumes:
      - vikunja-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIKUNJA_DB_USER:-vikunja} -p ${VIKUNJA_DB_PORT:-5435}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 30s

  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      vikunja-db:
        condition: service_healthy
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL:-http://localhost:3456}
      VIKUNJA_DATABASE_HOST: localhost:${VIKUNJA_DB_PORT:-5435}
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD:?VIKUNJA_DB_PASSWORD required}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: ${VIKUNJA_DB_USER:-vikunja}
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DB_NAME:-vikunja}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:?VIKUNJA_JWT_SECRET required}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${VIKUNJA_ENABLE_REGISTRATION:-true}
    volumes:
      - vikunja-files:/app/vikunja/files
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3456/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  vikunja-db:
    name: vikunja-db
  vikunja-files:
    name: vikunja-files
