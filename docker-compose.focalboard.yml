services:
  focalboard:
    image: mattermost/focalboard:latest
    container_name: focalboard
    ports:
      - "8000:8000"
    environment:
      - FOCALBOARD_PORT=8000
      - FOCALBOARD_DBTYPE=sqlite3
      - FOCALBOARD_DBCONFIG=./focalboard.db
    volumes:
      - ./focalboard-data:/opt/focalboard/data
    restart: unless-stopped